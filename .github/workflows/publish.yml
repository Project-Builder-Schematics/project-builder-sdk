name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refuse:
    if: ${{ !(github.repository == 'Project-Builder-Schematics/project-builder-sdk' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          printf "Publication requires manual dispatch from the canonical repository on main.\n"
          exit 1

  publish:
    if: github.repository == 'Project-Builder-Schematics/project-builder-sdk' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    concurrency:
      group: publish-pbuilder-sdk
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "25.9.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Run test suite
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Validate release
        id: release
        run: bun scripts/validate-release.ts

      - name: Publish
        id: publication
        run: |
          printf 'outcome=attempted\n' >> "$GITHUB_OUTPUT"
          npm publish --registry=https://registry.npmjs.org --tag=latest --access=public --provenance --fetch-retries=0 --fetch-timeout=30000
          printf 'outcome=command succeeded\n' >> "$GITHUB_OUTPUT"

      - name: Release outcome
        if: always()
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version || 'unavailable' }}
          PUBLISH_OUTCOME: ${{ steps.publication.outputs.outcome || 'blocked' }}
        run: |
          printf 'Package: @pbuilder/sdk\nVersion: %s\nSHA: %s\nRegistry: https://registry.npmjs.org\nChannel: latest\nOutcome: %s\nRegistry confirmation: owner verification pending\n' "$RELEASE_VERSION" "$GITHUB_SHA" "$PUBLISH_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
