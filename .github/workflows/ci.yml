name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:

# No id-token permission here — fork PRs must never have publish credentials.
permissions:
  contents: read

jobs:
  ci:
    name: Test, typecheck, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Run tests
        run: bun test

      - name: Typecheck (strict)
        run: bun run typecheck

      # The permissive-proof negative type matrix is now guarded by a real `bun test`
      # (test/types/permissive-proof.guard.test.ts), which pins the exact expected tsc
      # diagnostics by error code + directive region — strictly stronger than the old
      # inverted-exit step (which was blind to WHICH negative held). It runs above under
      # `bun test`, so no separate CI step is needed here.

  rules:
    name: Architecture rules
    runs-on: ubuntu-latest
    env:
      HAS_ARCHITECTURE_TOKEN: ${{ secrets.ARCHITECTURE_READ_TOKEN != '' }}
      # Fork PRs get no secrets, so only they may skip the suite; in this repository a missing
      # token or checkout is a defect.
      IS_FORK: ${{ github.repository != 'Project-Builder-Schematics/project-builder-sdk' || github.event.pull_request.head.repo.fork == true }}
      RULES_REQUIRE_ARCHITECTURE: "1"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Skip notice when the architecture token is absent
        if: env.HAS_ARCHITECTURE_TOKEN != 'true'
        run: |
          if [ "$IS_FORK" != "true" ]; then
            echo "::error::ARCHITECTURE_READ_TOKEN is missing in the canonical repository."
            exit 1
          fi
          echo "::notice::ARCHITECTURE_READ_TOKEN is not available (fork PR); the architecture rules suite is skipped."

      - name: Resolve the pinned architecture commit
        if: env.HAS_ARCHITECTURE_TOKEN == 'true'
        id: architecture
        run: echo "sha=$(git rev-parse HEAD:third_party/project-builder-architecture)" >> "$GITHUB_OUTPUT"

      # Full history, because a SHA ref with a shallow fetch brings no tags even with fetch-tags,
      # and the self-tests check that the pin is a release tag.
      - name: Check out the architecture submodule at its pinned commit
        if: env.HAS_ARCHITECTURE_TOKEN == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: Project-Builder-Schematics/project-builder-architecture
          ref: ${{ steps.architecture.outputs.sha }}
          token: ${{ secrets.ARCHITECTURE_READ_TOKEN }}
          path: third_party/project-builder-architecture
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: env.HAS_ARCHITECTURE_TOKEN == 'true'
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        if: env.HAS_ARCHITECTURE_TOKEN == 'true'
        run: bun install --frozen-lockfile

      - name: Runner self-tests
        if: env.HAS_ARCHITECTURE_TOKEN == 'true'
        run: bun test test/acceptance

      - name: Implemented rules (strict)
        if: env.HAS_ARCHITECTURE_TOKEN == 'true'
        run: bun run rules:implemented

      # Runs even when the strict pass fails, so the job output always shows what is still to
      # be built.
      - name: Designed rules (reports undefined steps)
        if: ${{ !cancelled() && env.HAS_ARCHITECTURE_TOKEN == 'true' }}
        run: bun run rules:designed
